<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | PeopleDesk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f5f3ff, #e0e7ff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
        }

        .auth-card {
            width: 100%;
            max-width: 490px;
            background: white;
            padding: 36px;
            border-radius: 22px;
            box-shadow: 0 18px 55px rgba(59, 45, 120, .13);
        }

        .brand-icon {
            width: 62px;
            height: 62px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 19px;
            background: linear-gradient(135deg, #6d5dfc, #8b5cf6);
            color: white;
            font-size: 26px;
        }

        .auth-card .form-control {
            padding: 11px 13px;
            border-radius: 10px;
        }

        .btn-register {
            width: 100%;
            padding: 12px;
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #6d5dfc, #8b5cf6);
        }

        .btn-register:hover {
            color: white;
            opacity: .92;
        }

        .auth-link {
            color: #6d5dfc;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="auth-card">

    <div class="text-center mb-4">
        <div class="brand-icon">
            <i class="fa-solid fa-user-plus"></i>
        </div>

        <h2 class="fw-bold mb-2">Create Account</h2>
        <p class="text-secondary">
            Join PeopleDesk to manage your workspace
        </p>
    </div>

    <div th:if="${emailError}"
         class="alert alert-danger"
         th:text="${emailError}">
    </div>

    <form th:action="@{/register/save}"
          th:object="${user}"
          method="post">

        <div class="mb-3">
            <label for="name" class="form-label fw-semibold">
                Full Name
            </label>

            <input type="text"
                   class="form-control"
                   id="name"
                   th:field="*{name}"
                   placeholder="Enter your full name"
                   autocomplete="name"
                   required>

            <div class="text-danger small mt-1"
                 th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}">
            </div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label fw-semibold">
                Email Address
            </label>

            <input type="email"
                   class="form-control"
                   id="email"
                   th:field="*{email}"
                   placeholder="you@example.com"
                   autocomplete="email"
                   required>

            <div class="text-danger small mt-1"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}">
            </div>
        </div>

        <div class="mb-4">
            <label for="password" class="form-label fw-semibold">
                Password
            </label>

            <input type="password"
                   class="form-control"
                   id="password"
                   th:field="*{password}"
                   placeholder="At least 8 characters"
                   minlength="8"
                   autocomplete="new-password"
                   required>

            <div class="text-danger small mt-1"
                 th:if="${#fields.hasErrors('password')}"
                 th:errors="*{password}">
            </div>

            <small class="text-secondary">
                Use at least 8 characters.
            </small>
        </div>

        <button type="submit" class="btn btn-register">
            <i class="fa-solid fa-user-check me-2"></i>
            Create Account
        </button>

    </form>

    <p class="text-center mt-4 mb-0 text-secondary">
        Already have an account?
        <a th:href="@{/login}" class="auth-link">Sign in</a>
    </p>

</div>

</body>
</html>
