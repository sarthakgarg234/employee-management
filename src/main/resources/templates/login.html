<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PeopleDesk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>

        body {
            min-height: 100vh;
            margin: 0;
            background-image:
                linear-gradient(
                    rgba(35, 30, 90, 0.48),
                    rgba(35, 30, 90, 0.58)
                ),
                url('/images/login-bg.jpeg');
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
        }

        .auth-card {
            position: relative;
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.97);
            padding: 38px;
            border-radius: 22px;
            box-shadow: 0 18px 55px rgba(20, 15, 60, 0.3);
        }

        .brand-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: linear-gradient(135deg, #6d5dfc, #8b5cf6);
            color: white;
            font-size: 27px;
        }

        .auth-card .form-control {
            padding: 12px 14px;
            border-radius: 10px;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #6d5dfc, #8b5cf6);
        }

        .btn-login:hover {
            color: white;
            opacity: .92;
        }

        .auth-link {
            color: #6d5dfc;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="auth-card">

    <div class="text-center">
        <div class="brand-icon">
            <i class="fa-solid fa-users"></i>
        </div>

        <h2 class="fw-bold mb-2">Welcome Back!</h2>
        <p class="text-secondary mb-4">
            Sign in to your PeopleDesk account
        </p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger">
        Invalid email or password. Please try again.
    </div>

    <div th:if="${param.logout}" class="alert alert-success">
        You have been logged out successfully.
    </div>

    <div th:if="${successMessage}"
         class="alert alert-success"
         th:text="${successMessage}">
    </div>

    <form th:action="@{/login}" method="post">

        <div class="mb-3">
            <label for="username" class="form-label fw-semibold">
                Email Address
            </label>

            <input type="email"
                   class="form-control"
                   id="username"
                   name="username"
                   placeholder="you@example.com"
                   autocomplete="email"
                   required>
        </div>

        <div class="mb-4">
            <label for="password" class="form-label fw-semibold">
                Password
            </label>

            <input type="password"
                   class="form-control"
                   id="password"
                   name="password"
                   placeholder="Enter your password"
                   autocomplete="current-password"
                   required>
        </div>

        <button type="submit" class="btn btn-login">
            <i class="fa-solid fa-right-to-bracket me-2"></i>
            Sign In
        </button>

    </form>

    <p class="text-center mt-4 mb-0 text-secondary">
        Don't have an account?
        <a th:href="@{/register}" class="auth-link">Create account</a>
    </p>

</div>

</body>
</html>
