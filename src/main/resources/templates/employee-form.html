<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Employee Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-dark app-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/employees}">
            <i class="bi bi-people-fill me-2"></i>PeopleDesk
        </a>

        <a th:href="@{/employees}" class="btn btn-outline-light btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Back to Directory
        </a>
    </div>
</nav>

<main class="container py-5 form-page">

    <div class="mb-4">
        <p class="eyebrow mb-2">EMPLOYEE MANAGEMENT</p>
        <h1 class="page-title" th:text="${pageTitle}">Add New Employee</h1>
        <p class="text-secondary">Enter the employee details below.</p>
    </div>

    <section class="content-card form-card">

        <form th:action="@{/employees/save}" th:object="${employee}" method="post">

            <input type="hidden" th:field="*{id}">

            <div class="mb-4">
                <label class="form-label" for="name">Full Name</label>
                <input class="form-control form-control-lg"
                       id="name"
                       type="text"
                       th:field="*{name}"
                       placeholder="e.g. Rahul Sharma"
                       required
                       maxlength="100">
            </div>

            <div class="mb-4">
                <label class="form-label" for="email">Email Address</label>
                <input class="form-control form-control-lg"
                       id="email"
                       type="email"
                       th:field="*{email}"
                       placeholder="rahul@example.com"
                       required
                       maxlength="150">
            </div>

            <div class="mb-4">
                <label class="form-label" for="department">Department</label>
                <select class="form-select form-select-lg"
                        id="department"
                        th:field="*{department}">
                    <option value="">Select department</option>
                    <option value="Engineering">Engineering</option>
                    <option value="Human Resources">Human Resources</option>
                    <option value="Finance">Finance</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Sales">Sales</option>
                    <option value="Operations">Operations</option>
                    <option value="Support">Support</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label" for="salary">Monthly Salary (₹)</label>
                <input class="form-control form-control-lg"
                       id="salary"
                       type="number"
                       th:field="*{salary}"
                       placeholder="e.g. 45000"
                       min="0"
                       step="0.01">
            </div>

            <div class="d-flex flex-wrap gap-2 pt-2">
                <button type="submit" class="btn btn-primary btn-lg rounded-3">
                    <i class="bi bi-check2-circle me-2"></i>Save Employee
                </button>

                <a th:href="@{/employees}" class="btn btn-light btn-lg rounded-3">
                    Cancel
                </a>
            </div>

        </form>
    </section>
</main>

</body>
</html>
