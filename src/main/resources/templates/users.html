<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Users | PeopleDesk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4 py-3">
    <a class="navbar-brand fw-bold" th:href="@{/employees}">
        <i class="fa-solid fa-users me-2"></i>PeopleDesk
    </a>

    <div class="d-flex gap-2 align-items-center">
        <a th:href="@{/employees}" class="btn btn-outline-light btn-sm">
            Employees
        </a>
        <a th:href="@{/users}" class="btn btn-light btn-sm">
            Users
        </a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-danger btn-sm">
                <i class="fa-solid fa-right-from-bracket me-1"></i>Logout
            </button>
        </form>
    </div>
</nav>

<main class="container py-5">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
            <h2 class="fw-bold mb-1">Registered Users</h2>
            <p class="text-secondary mb-0">
                View and search accounts registered in PeopleDesk.
            </p>
        </div>

        <div class="bg-white rounded-3 shadow-sm p-3">
            <span class="text-secondary">Total registered users</span>
            <h3 class="fw-bold mb-0" th:text="${totalUsers}">0</h3>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">

            <form th:action="@{/users}" method="get" class="row g-2 mb-4">
                <div class="col-md-9">
                    <input type="search"
                           name="keyword"
                           class="form-control"
                           placeholder="Search by name or email..."
                           th:value="${keyword}">
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-fill">
                        <i class="fa-solid fa-magnifying-glass me-1"></i>Search
                    </button>
                    <a th:href="@{/users}" class="btn btn-outline-secondary">
                        Reset
                    </a>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email Address</th>
                        <th>Account Type</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">1</td>
                        <td>
                            <i class="fa-solid fa-circle-user text-primary me-2"></i>
                            <span th:text="${user.name}">User Name</span>
                        </td>
                        <td th:text="${user.email}">user@example.com</td>
                        <td>
                            <span class="badge text-bg-primary">USER</span>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="4" class="text-center py-5 text-secondary">
                            <i class="fa-solid fa-users-slash fa-2x mb-3 d-block"></i>
                            No registered users found.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</main>

</body>
</html>
